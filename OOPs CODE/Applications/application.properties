spring.application.name=bank-system
server.port=8080

# Default database: H2, saved as a file in ./data so data survives restarts
spring.datasource.url=jdbc:h2:file:./data/bankdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate creates and updates tables from your entity classes
spring.jpa.hibernate.ddl-auto=update